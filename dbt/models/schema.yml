models:
  - name: offers
    columns:
      - {name: offer_id, data_tests: [unique, not_null]}
      - {name: status, data_tests: [{accepted_values: {arguments: {values: [active, close]}}}]}
      - {name: salary_origin, data_tests: [{accepted_values: {arguments: {values: [employeur]}}}]}
  - name: salaries
    columns:
      - {name: offer_id, data_tests: [not_null]}
  - name: salary_text
    columns:
      - {name: offer_id, data_tests: [not_null]}
      - {name: excluded, data_tests: [{accepted_values: {arguments: {values: [net, freelance, variable, cap_only, floor_only, unknown_period, range_too_wide, out_of_bounds]}, config: {where: "excluded is not null"}}}]}
  - name: source_ranking
    columns:
      - {name: source_id, data_tests: [unique, not_null]}
  - name: health
    columns:
      - {name: source_id, data_tests: [unique, not_null]}
  - name: postings
    columns:
      - {name: offer_id, data_tests: [unique, not_null]}
      - {name: title, data_tests: [not_null]}
      - {name: source_id, data_tests: [{accepted_values: {arguments: {values: [job_room, eures, adem, govjobs, jobs_lu, moovijob, luxsearch, jobfinder, indeed_lu]}}}]}
