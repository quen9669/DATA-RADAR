name: radar
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      sql:
        description: DuckDB SQL run against the R2 bucket (query job)
        required: false
      reqs:
        description: TEMP probe, JSON list of [method, url, body|null]
        required: false
permissions:
  contents: read
jobs:
  lines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest
      - run: |
          n=$(git ls-files '*.py' '*.sql' '*.yml' '*.yaml' '*.toml' | xargs cat | wc -l)
          echo "Lines: $n / 1000" >> "$GITHUB_STEP_SUMMARY"
          test "$n" -le 1000
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install duckdb-cli==2.0.1
      - run: |
          python3 -c "import sqlite3; c = sqlite3.connect('f.db'); c.execute('CREATE TABLE jobs (id, salary)'); c.executemany('INSERT INTO jobs VALUES (?, ?)', [(1, 5000), (2, 'n/a')]); c.commit()"
          mkdir out && LEGACY=sqlite:f.db SCHEMAS=main DEST=out duckdb -bail < export_legacy.sql
  query:
    if: github.event_name == 'workflow_dispatch' && inputs.sql != ''
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_KEY_ID: ${{ secrets.R2_KEY_ID }}
      R2_SECRET: ${{ secrets.R2_SECRET }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      SQL: ${{ inputs.sql }}
    steps:
      - run: pip install duckdb-cli==2.0.1
      - shell: bash
        run: |
          { echo "CREATE SECRET (TYPE r2, KEY_ID getenv('R2_KEY_ID'), SECRET getenv('R2_SECRET'), ACCOUNT_ID getenv('R2_ACCOUNT_ID'));"
            echo ".mode markdown"; echo "$SQL"; } | duckdb -bail | tee -a "$GITHUB_STEP_SUMMARY"
  build:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_KEY_ID: ${{ secrets.R2_KEY_ID }}
      R2_SECRET: ${{ secrets.R2_SECRET }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install dbt-duckdb==1.11.1 pandas
      - working-directory: dbt
        run: |
          dbt build --profiles-dir .
          for m in source_ranking health salary_check; do dbt show --profiles-dir . -s $m --limit 30 | tee -a "$GITHUB_STEP_SUMMARY"; done
  probe:
    if: github.event_name == 'workflow_dispatch' && inputs.reqs != ''
    runs-on: ubuntu-latest
    env:
      REQS: ${{ inputs.reqs }}
    steps:
      - shell: python
        run: |
          import json, os, urllib.request
          import re
          for m, u, b in json.loads(os.environ["REQS"]):
              if m == "GREP":
                  t = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=30).read().decode("utf8", "replace")
                  print("==", u, len(t)); print("\n".join(sorted(set(re.findall(b, t)))[:80])); continue
              r = urllib.request.Request(u, json.dumps(b).encode() if b else None, {"Content-Type": "application/json", "Accept": "application/json, text/html", "User-Agent": "Mozilla/5.0"}, method=m)
              try:
                  with urllib.request.urlopen(r, timeout=30) as x:
                      t = x.read().decode("utf8", "replace"); print("==", m, u, x.status, x.headers.get("content-type"), x.headers.get("x-total-count"), len(t)); print(t[:2500])
              except Exception as e:
                  print("==", m, u, "ERR", e, getattr(e, "read", lambda: b"")()[:300])
