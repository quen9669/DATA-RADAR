name: probe
on: push
jobs:
  p:
    if: github.ref == 'refs/heads/claude/project-thread-lhfc82'
    runs-on: ubuntu-latest
    steps:
      - run: pip install curl_cffi
      - run: |
          cat > /tmp/p.py <<'PY'
          import re
          from curl_cffi import requests
          for host, path in (("www", "offres-emploi/jobs-luxembourg?page=2"), ("www", "sitemap.xml"), ("en", "job-offers/jobs-luxembourg/page-2")):
            for imp in ("chrome", "safari17_0", "firefox"):
              try:
                r = requests.get(f"https://{host}.moovijob.com/{path}", impersonate=imp, timeout=30)
                print(host, path, imp, r.status_code, len(r.text), "CF" if "Just a moment" in r.text else "ok", len(set(re.findall(r"offres-emploi/[a-z0-9-]+/[a-z0-9-]{12,}", r.text))), flush=True)
              except Exception as e:
                print(host, path, imp, "ERR", str(e)[:80], flush=True)
          PY
          python /tmp/p.py
