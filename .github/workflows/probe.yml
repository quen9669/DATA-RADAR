name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in robots.txt sitemap.xml sitemap_index.xml offres-emploi/jobs-luxembourg?page=2; do
            echo "== $u"; curl -sS -m 30 -A "Mozilla/5.0" -o /tmp/o -w "%{http_code} %{size_download}\n" "https://www.moovijob.com/$u"; head -c 600 /tmp/o; echo
          done
          curl -sS -m 30 -A "Mozilla/5.0" https://www.moovijob.com/offres-emploi/jobs-luxembourg?page=2 -o /tmp/l.html
          grep -o 'offres-emploi/[a-z0-9-]*/[a-z0-9-]*' /tmp/l.html | sort -u | head -5
          u=$(grep -o 'https://www.moovijob.com/offres-emploi/[a-z0-9-]*/[a-z0-9-]*-[a-z0-9]\{5\}' /tmp/l.html | grep -v jobs-luxembourg | head -1)
          echo "== detail $u"; curl -sS -m 30 -A "Mozilla/5.0" -o /tmp/d.html -w "%{http_code} %{size_download}\n" "$u"
          grep -c 'ld+json' /tmp/d.html; grep -o 'Entre[^€]*€[^<]\{0,20\}' /tmp/d.html | head -2
